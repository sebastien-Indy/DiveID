<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiveID — Mon profil</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #061020; --blue: #0d4f8c; --cyan: #00c4e8;
      --cyan-dim: rgba(0,196,232,0.1); --cyan-border: rgba(0,196,232,0.2);
      --white: #f0f4f8; --muted: rgba(240,244,248,0.45);
      --card-bg: rgba(13,22,40,0.75); --green: #00e8a2; --red: #e84f4f; --amber: #e8b800;
    }
    html, body { min-height: 100%; background: var(--deep); color: var(--white); font-family: 'DM Sans', sans-serif; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 100%, rgba(13,79,140,0.4) 0%, transparent 70%); pointer-events: none; z-index: 0; }

    nav { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 24px 48px; border-bottom: 1px solid var(--cyan-border); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--white); text-decoration: none; }
    .logo span { color: var(--cyan); }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-user { font-size: 13px; color: var(--muted); }
    .btn { padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: all 0.2s; font-family: 'DM Sans', sans-serif; border: none; }
    .btn-outline { border: 1px solid var(--cyan-border) !important; background: transparent; color: var(--cyan); }
    .btn-outline:hover { background: var(--cyan-dim); }
    .btn-red { background: rgba(232,79,79,0.15); color: var(--red); border: 1px solid rgba(232,79,79,0.3) !important; }
    .btn-red:hover { background: rgba(232,79,79,0.25); }

    .main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }

    /* SIDEBAR */
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    .profile-card { background: var(--card-bg); border: 1px solid var(--cyan-border); border-radius: 16px; padding: 32px 24px; text-align: center; backdrop-filter: blur(12px); }
    .avatar { width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--cyan)); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--deep); margin: 0 auto 16px; border: 3px solid var(--cyan-border); }
    .profile-name { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; margin-bottom: 4px; }
    .profile-email { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

    .status-toggle { display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 100px; padding: 8px 20px; cursor: pointer; transition: all 0.2s; margin-bottom: 20px; border: 1px solid; }
    .status-toggle.disponible { background: rgba(0,232,162,0.1); border-color: rgba(0,232,162,0.3); }
    .status-toggle.indisponible { background: rgba(232,79,79,0.1); border-color: rgba(232,79,79,0.3); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-toggle.disponible .status-dot { background: var(--green); animation: pulse 2s infinite; }
    .status-toggle.indisponible .status-dot { background: var(--red); }
    .status-text { font-size: 13px; font-weight: 500; }
    .status-toggle.disponible .status-text { color: var(--green); }
    .status-toggle.indisponible .status-text { color: var(--red); }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

    .profile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pstat { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 12px; text-align: center; }
    .pstat-num { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--cyan); }
    .pstat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .hamburger-menu { position: relative; }
    .hamburger-btn { display: flex; flex-direction: column; gap: 5px; cursor: pointer; background: var(--card-bg); border: 1px solid var(--cyan-border); border-radius: 10px; padding: 12px 14px; transition: all 0.2s; width: fit-content; }
    .hamburger-btn:hover { background: var(--cyan-dim); }
    .hamburger-btn span { display: block; width: 22px; height: 2px; background: var(--cyan); border-radius: 2px; transition: all 0.3s; }
    .hamburger-btn.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger-btn.open span:nth-child(2) { opacity: 0; }
    .hamburger-btn.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .dropdown-nav { display: none; position: absolute; top: calc(100% + 8px); left: 0; background: var(--card-bg); border: 1px solid var(--cyan-border); border-radius: 14px; overflow: hidden; backdrop-filter: blur(16px); min-width: 220px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.4); animation: dropIn 0.2s ease; }
    .dropdown-nav.open { display: block; }
    @keyframes dropIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
    .dropdown-item { display: flex; align-items: center; gap: 12px; padding: 14px 18px; font-size: 14px; color: var(--muted); text-decoration: none; transition: all 0.15s; border-bottom: 1px solid rgba(0,196,232,0.06); }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover, .dropdown-item.active { background: var(--cyan-dim); color: var(--cyan); }

    /* CONTENT */
    .content { display: flex; flex-direction: column; gap: 24px; }
    .section-card { background: var(--card-bg); border: 1px solid var(--cyan-border); border-radius: 16px; padding: 28px; backdrop-filter: blur(12px); }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 1px; }
    .section-action { font-size: 13px; color: var(--cyan); cursor: pointer; border: 1px solid var(--cyan-border); background: transparent; padding: 6px 14px; border-radius: 8px; transition: background 0.2s; font-family: 'DM Sans', sans-serif; text-decoration: none; }
    .section-action:hover { background: var(--cyan-dim); }

    /* PROFIL FORM */
    .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
    .field-input { background: rgba(255,255,255,0.05); border: 1px solid var(--cyan-border); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--white); font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; width: 100%; }
    .field-input:focus { border-color: var(--cyan); }
    .field-input::placeholder { color: var(--muted); }
    .btn-save { background: var(--cyan); border: none; color: var(--deep); padding: 11px 24px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.2s; margin-top: 16px; }
    .btn-save:hover { opacity: 0.85; }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

    /* CERTIFICATIONS */
    .cert-list { display: flex; flex-direction: column; gap: 12px; }
    .cert-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); transition: border-color 0.2s; }
    .cert-item:hover { border-color: var(--cyan-border); }
    .cert-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .cert-icon.valide { background: rgba(0,232,162,0.12); }
    .cert-icon.bientot { background: rgba(232,184,0,0.12); }
    .cert-icon.expire { background: rgba(232,79,79,0.12); }
    .cert-info { flex: 1; }
    .cert-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
    .cert-meta { font-size: 12px; color: var(--muted); }
    .cert-badge { font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 100px; flex-shrink: 0; }
    .cert-badge.valide { background: rgba(0,232,162,0.15); color: var(--green); border: 1px solid rgba(0,232,162,0.3); }
    .cert-badge.bientot { background: rgba(232,184,0,0.15); color: var(--amber); border: 1px solid rgba(232,184,0,0.3); }
    .cert-badge.expire { background: rgba(232,79,79,0.15); color: var(--red); border: 1px solid rgba(232,79,79,0.3); }

    .empty { text-align: center; padding: 32px; color: var(--muted); }
    .empty-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-text { font-size: 14px; }

    .toast { position: fixed; top: 24px; right: 24px; z-index: 100; padding: 12px 20px; border-radius: 10px; font-size: 14px; display: none; animation: fadeIn 0.3s ease; }
    .toast.success { background: rgba(0,232,162,0.15); border: 1px solid rgba(0,232,162,0.4); color: var(--green); display: block; }
    .toast.error { background: rgba(232,79,79,0.15); border: 1px solid rgba(232,79,79,0.4); color: var(--red); display: block; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }

    .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

    @media (max-width: 768px) {
      nav { padding: 16px 20px; }
      .main { grid-template-columns: 1fr; padding: 20px 16px 60px; }
      .fields-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<nav>
  <a class="logo" href="index.html">Dive<span>ID</span></a>
  <div class="nav-right">
    <span class="nav-user" id="navUser">Chargement...</span>
    <a href="certifications.html" class="btn btn-outline">Mes certifications</a>
    <button class="btn btn-red" onclick="deconnexion()">Déconnexion</button>
  </div>
</nav>

<div class="main">
  <aside class="sidebar">
    <div class="profile-card">
      <div class="avatar" id="avatarInitiales">??</div>
      <div class="profile-name" id="profileNom">Chargement...</div>
      <div class="profile-email" id="profileEmail">—</div>
      <div class="status-toggle disponible" id="statusToggle" onclick="toggleStatut()">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Disponible</span>
      </div>
      <div class="profile-stats">
        <div class="pstat"><div class="pstat-num" id="nbCertifs">—</div><div class="pstat-label">Certifs</div></div>
        <div class="pstat"><div class="pstat-num" id="nbAnnees">—</div><div class="pstat-label">Années</div></div>
      </div>
    </div>

    <div class="hamburger-menu">
      <div class="hamburger-btn" id="hamburgerBtn" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </div>
      <nav class="dropdown-nav" id="dropdownNav">
        <a class="dropdown-item active" href="#">👤 Mon profil</a>
        <a class="dropdown-item" href="certifications.html">📋 Certifications</a>
        <a class="dropdown-item" href="rapport-upload.html">📄 Mes rapports</a>
        <a class="dropdown-item" href="zacces.html">🔑 Demandes d'accès</a>
        <a class="dropdown-item" href="notifications.html">🔔 Notifications</a>
      </nav>
    </div>
  </aside>

  <div class="content">

    <!-- INFOS PERSONNELLES -->
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">Informations personnelles</div>
        <button class="section-action" id="btnSave" onclick="sauvegarderProfil()">💾 Sauvegarder</button>
      </div>
      <div class="fields-grid">
        <div class="field">
          <label class="field-label">Prénom</label>
          <input class="field-input" type="text" id="inputPrenom" placeholder="Votre prénom" />
        </div>
        <div class="field">
          <label class="field-label">Nom</label>
          <input class="field-input" type="text" id="inputNom" placeholder="Votre nom" />
        </div>
        <div class="field">
          <label class="field-label">Province</label>
          <select class="field-input" id="inputProvince">
            <option value="">— Sélectionner —</option>
            <option value="Québec">Québec</option>
            <option value="Ontario">Ontario</option>
            <option value="Colombie-Britannique">Colombie-Britannique</option>
            <option value="Alberta">Alberta</option>
            <option value="Nouvelle-Écosse">Nouvelle-Écosse</option>
            <option value="Autre">Autre</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label">Courriel</label>
          <input class="field-input" type="email" id="inputEmail" disabled style="opacity:0.5;cursor:not-allowed;" />
        </div>
      </div>
    </div>

    <!-- CERTIFICATIONS -->
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">Mes certifications</div>
        <a class="section-action" href="certifications.html">+ Ajouter</a>
      </div>
      <div id="certContainer"><div class="loading">⏳ Chargement...</div></div>
    </div>

  </div>
</div>

<script>
  const { createClient } = supabase;
  const db = createClient(
    'https://wslkcduuvcmonzftqxuy.supabase.co',
    'sb_publishable_JlTuBLmGtMCMHe7A7aWSuQ_CJbeX_jL'
  );

  let currentUser = null;
  let disponible = true;

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type;
    setTimeout(() => t.className = 'toast', 3000);
  }

  function getInitiales(prenom, nom) {
    return ((prenom?.[0] || '') + (nom?.[0] || '')).toUpperCase() || '??';
  }

  function calculerStatut(dateExp) {
    if (!dateExp) return 'valide';
    const diff = (new Date(dateExp) - new Date()) / (1000 * 60 * 60 * 24);
    if (diff < 0) return 'expire';
    if (diff < 90) return 'bientot';
    return 'valide';
  }

  function labelStatut(s) {
    if (s === 'expire') return '✕ Expirée';
    if (s === 'bientot') return '⚠ Bientôt';
    return '✓ Valide';
  }

  async function chargerProfil() {
    // Vérifier session
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'zconnexion.html'; return; }

    currentUser = session.user;
    const meta = currentUser.user_metadata || {};

    // Nav
    document.getElementById('navUser').textContent = (meta.prenom || '') + ' ' + (meta.nom || '');
    document.getElementById('profileEmail').textContent = currentUser.email;
    document.getElementById('inputEmail').value = currentUser.email;

    // Charger profil depuis la table profils
    const { data: profil } = await db.from('profils').select('*').eq('user_id', currentUser.id).single();

    if (profil) {
      document.getElementById('inputPrenom').value = profil.prenom || meta.prenom || '';
      document.getElementById('inputNom').value = profil.nom || meta.nom || '';
      if (profil.province) document.getElementById('inputProvince').value = profil.province;
      disponible = profil.disponible !== false;
    } else {
      // Première connexion — préremplir avec les données d'inscription
      document.getElementById('inputPrenom').value = meta.prenom || '';
      document.getElementById('inputNom').value = meta.nom || '';
    }

    const prenom = document.getElementById('inputPrenom').value;
    const nom = document.getElementById('inputNom').value;
    document.getElementById('profileNom').textContent = prenom + ' ' + nom || 'Mon profil';
    document.getElementById('avatarInitiales').textContent = getInitiales(prenom, nom);

    // Statut
    mettreAJourStatut();

    // Années (basé sur date d'inscription)
    const annees = new Date().getFullYear() - new Date(currentUser.created_at).getFullYear();
    document.getElementById('nbAnnees').textContent = annees || '< 1';

    // Certifications
    await chargerCertifications();
  }

  async function chargerCertifications() {
    const { data, error } = await db.from('certifications').select('*').order('date_expiration', { ascending: true });
    const container = document.getElementById('certContainer');
    document.getElementById('nbCertifs').textContent = data?.length || 0;

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Aucune certification. <a href="certifications.html" style="color:var(--cyan)">Ajoutez-en une !</a></div></div>';
      return;
    }

    container.innerHTML = '<div class="cert-list">' + data.map(cert => {
      const statut = cert.statut || calculerStatut(cert.date_expiration);
      const dateExp = cert.date_expiration ? new Date(cert.date_expiration).toLocaleDateString('fr-CA', {day:'numeric',month:'long',year:'numeric'}) : '—';
      const icons = { valide: '🏅', bientot: '⚠️', expire: '🚨' };
      return `
        <div class="cert-item">
          <div class="cert-icon ${statut}">${icons[statut] || '🏅'}</div>
          <div class="cert-info">
            <div class="cert-name">${cert.nom}</div>
            <div class="cert-meta">Expire le ${dateExp}</div>
          </div>
          <span class="cert-badge ${statut}">${labelStatut(statut)}</span>
        </div>`;
    }).join('') + '</div>';
  }

  function mettreAJourStatut() {
    const toggle = document.getElementById('statusToggle');
    const text = document.getElementById('statusText');
    if (disponible) {
      toggle.className = 'status-toggle disponible';
      text.textContent = 'Disponible';
    } else {
      toggle.className = 'status-toggle indisponible';
      text.textContent = 'Non disponible';
    }
  }

  async function toggleStatut() {
    disponible = !disponible;
    mettreAJourStatut();
    if (currentUser) {
      await db.from('profils').upsert({ user_id: currentUser.id, disponible }, { onConflict: 'user_id' });
      showToast(disponible ? '✓ Statut : Disponible' : '✓ Statut : Non disponible', 'success');
    }
  }

  async function sauvegarderProfil() {
    const prenom = document.getElementById('inputPrenom').value.trim();
    const nom = document.getElementById('inputNom').value.trim();
    const province = document.getElementById('inputProvince').value;

    if (!prenom || !nom) { showToast('⚠ Veuillez entrer votre prénom et nom.', 'error'); return; }

    const btn = document.getElementById('btnSave');
    btn.disabled = true; btn.textContent = 'Sauvegarde...';

    const { error } = await db.from('profils').upsert({
      user_id: currentUser.id, prenom, nom, province, disponible, type: currentUser.user_metadata?.type || 'plongeur'
    }, { onConflict: 'user_id' });

    if (error) {
      showToast('❌ Erreur : ' + error.message, 'error');
    } else {
      document.getElementById('profileNom').textContent = prenom + ' ' + nom;
      document.getElementById('avatarInitiales').textContent = getInitiales(prenom, nom);
      document.getElementById('navUser').textContent = prenom + ' ' + nom;
      showToast('✓ Profil sauvegardé !', 'success');
    }

    btn.disabled = false; btn.textContent = '💾 Sauvegarder';
  }

  async function deconnexion() {
    await db.auth.signOut();
    window.location.href = 'zconnexion.html';
  }

  function toggleMenu() {
    document.getElementById('hamburgerBtn').classList.toggle('open');
    document.getElementById('dropdownNav').classList.toggle('open');
  }

  // Fermer le menu si on clique ailleurs
  document.addEventListener('click', function(e) {
    const menu = document.getElementById('hamburgerBtn');
    const nav = document.getElementById('dropdownNav');
    if (!menu.contains(e.target) && !nav.contains(e.target)) {
      menu.classList.remove('open');
      nav.classList.remove('open');
    }
  });

  // Démarrer
  chargerProfil();
</script>

</body>
</html>
