<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiveID — Mes certifications</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #061020; --blue: #0d4f8c; --cyan: #00c4e8;
      --cyan-dim: rgba(0,196,232,0.1); --cyan-border: rgba(0,196,232,0.2);
      --white: #f0f4f8; --muted: rgba(240,244,248,0.45);
      --card-bg: rgba(13,22,40,0.75); --green: #00e8a2; --red: #e84f4f; --amber: #e8b800;
    }
    html, body { min-height: 100%; background: var(--deep); color: var(--white); font-family: 'DM Sans', sans-serif; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 100%, rgba(13,79,140,0.4) 0%, transparent 70%); pointer-events: none; z-index: 0; }

    nav { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 24px 48px; border-bottom: 1px solid var(--cyan-border); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--white); text-decoration: none; }
    .logo span { color: var(--cyan); }
    .btn { padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: all 0.2s; font-family: 'DM Sans', sans-serif; border: none; }
    .btn-outline { border: 1px solid var(--cyan-border) !important; background: transparent; color: var(--cyan); }
    .btn-outline:hover { background: var(--cyan-dim); }
    .btn-red { background: rgba(232,79,79,0.15); color: var(--red); border: 1px solid rgba(232,79,79,0.3) !important; }

    .main { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 24px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; margin-bottom: 4px; }
    .page-sub { font-size: 14px; color: var(--muted); }

    .card { background: var(--card-bg); border: 1px solid var(--cyan-border); border-radius: 16px; padding: 28px; backdrop-filter: blur(12px); }
    .card-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--cyan); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--cyan-border); }

    .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
    .field-input { background: rgba(255,255,255,0.05); border: 1px solid var(--cyan-border); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--white); font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; width: 100%; }
    .field-input:focus { border-color: var(--cyan); }
    .field-input::placeholder { color: var(--muted); }
    select.field-input { cursor: pointer; }

    /* UPLOAD ZONE */
    .upload-zone { border: 2px dashed var(--cyan-border); border-radius: 12px; padding: 32px 24px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; margin-bottom: 20px; }
    .upload-zone:hover, .upload-zone.dragover { border-color: var(--cyan); background: var(--cyan-dim); }
    .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .upload-icon { font-size: 36px; margin-bottom: 10px; display: block; }
    .upload-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
    .upload-sub { font-size: 13px; color: var(--muted); }
    .upload-formats { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
    .format-badge { font-size: 11px; padding: 3px 10px; border-radius: 100px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: var(--muted); }

    /* FILE PREVIEW */
    .file-preview { display: none; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; background: rgba(0,196,232,0.05); border: 1px solid var(--cyan-border); margin-bottom: 20px; }
    .file-preview.visible { display: flex; }
    .file-preview-icon { font-size: 24px; flex-shrink: 0; }
    .file-preview-name { font-size: 14px; font-weight: 500; flex: 1; }
    .file-preview-size { font-size: 12px; color: var(--muted); }
    .file-preview-remove { background: none; border: none; color: var(--red); cursor: pointer; font-size: 18px; padding: 0; }

    /* PROGRESS */
    .progress-bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); margin-bottom: 16px; overflow: hidden; display: none; }
    .progress-bar.visible { display: block; }
    .progress-fill { height: 100%; background: var(--cyan); border-radius: 2px; transition: width 0.3s ease; width: 0%; }

    .btn-submit { width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--cyan); color: var(--deep); font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.2s; }
    .btn-submit:hover { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* LISTE */
    .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .list-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--cyan); }
    .cert-count { font-size: 13px; color: var(--muted); }

    .cert-list { display: flex; flex-direction: column; gap: 12px; }
    .cert-item { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); transition: border-color 0.2s; }
    .cert-item:hover { border-color: var(--cyan-border); }
    .cert-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .cert-icon.valide { background: rgba(0,232,162,0.12); }
    .cert-icon.bientot { background: rgba(232,184,0,0.12); }
    .cert-icon.expire { background: rgba(232,79,79,0.12); }
    .cert-info { flex: 1; }
    .cert-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
    .cert-meta { font-size: 12px; color: var(--muted); }
    .cert-badge { font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 100px; flex-shrink: 0; }
    .cert-badge.valide { background: rgba(0,232,162,0.15); color: var(--green); border: 1px solid rgba(0,232,162,0.3); }
    .cert-badge.bientot { background: rgba(232,184,0,0.15); color: var(--amber); border: 1px solid rgba(232,184,0,0.3); }
    .cert-badge.expire { background: rgba(232,79,79,0.15); color: var(--red); border: 1px solid rgba(232,79,79,0.3); }
    .cert-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-view { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--cyan-border); background: transparent; color: var(--cyan); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; text-decoration: none; }
    .btn-view:hover { background: var(--cyan-dim); }
    .btn-delete { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid rgba(232,79,79,0.3); background: transparent; color: var(--red); cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .btn-delete:hover { background: rgba(232,79,79,0.1); }

    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; }
    .loading { text-align: center; padding: 30px; color: var(--muted); font-size: 14px; }

    .toast { position: fixed; top: 24px; right: 24px; z-index: 100; padding: 12px 20px; border-radius: 10px; font-size: 14px; display: none; }
    .toast.success { background: rgba(0,232,162,0.15); border: 1px solid rgba(0,232,162,0.4); color: var(--green); display: block; }
    .toast.error { background: rgba(232,79,79,0.15); border: 1px solid rgba(232,79,79,0.4); color: var(--red); display: block; }

    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .fields-grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px 60px; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<nav>
  <a class="logo" href="index.html">Dive<span>ID</span></a>
  <div style="display:flex;gap:10px;">
    <a href="zplongeur.html" class="btn btn-outline">← Mon profil</a>
    <button class="btn btn-red" onclick="deconnexion()">Déconnexion</button>
  </div>
</nav>

<div class="main">
  <div>
    <div class="page-title">Mes certifications</div>
    <div class="page-sub">Ajoutez vos certifications avec un scan ou une photo.</div>
  </div>

  <!-- FORMULAIRE -->
  <div class="card">
    <div class="card-title">➕ Ajouter une certification</div>

    <div class="fields-grid">
      <div class="field">
        <label class="field-label">Nom de la certification *</label>
        <input class="field-input" type="text" id="nom" placeholder="ex. DCBC Classe A" />
      </div>
      <div class="field">
        <label class="field-label">Statut</label>
        <select class="field-input" id="statut">
          <option value="valide">Valide</option>
          <option value="bientot">Expire bientôt</option>
          <option value="expire">Expirée</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Date d'émission</label>
        <input class="field-input" type="date" id="date_emission" />
      </div>
      <div class="field">
        <label class="field-label">Date d'expiration</label>
        <input class="field-input" type="date" id="date_expiration" />
      </div>
    </div>

    <!-- UPLOAD -->
    <div class="upload-zone" id="uploadZone">
      <input type="file" accept="image/*,.pdf" id="fileInput" onchange="handleFile(this)" />
      <span class="upload-icon">📎</span>
      <div class="upload-title">Glissez votre scan ici</div>
      <div class="upload-sub">Photo, scan PDF — optionnel mais recommandé</div>
      <div class="upload-formats">
        <span class="format-badge">JPG</span>
        <span class="format-badge">PNG</span>
        <span class="format-badge">PDF</span>
        <span class="format-badge">HEIC</span>
      </div>
    </div>

    <div class="file-preview" id="filePreview">
      <span class="file-preview-icon" id="previewIcon">📄</span>
      <div>
        <div class="file-preview-name" id="previewName"></div>
        <div class="file-preview-size" id="previewSize"></div>
      </div>
      <button class="file-preview-remove" onclick="removeFile()">✕</button>
    </div>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <button class="btn-submit" id="btnAjouter" onclick="ajouterCertification()">
      ✓ Ajouter la certification
    </button>
  </div>

  <!-- LISTE -->
  <div class="card">
    <div class="list-header">
      <div class="list-title">Mes certifications</div>
      <div class="cert-count" id="certCount">Chargement...</div>
    </div>
    <div id="certList"><div class="loading">⏳ Chargement...</div></div>
  </div>
</div>

<script>
  const { createClient } = supabase;
  const db = createClient(
    'https://wslkcduuvcmonzftqxuy.supabase.co',
    'sb_publishable_JlTuBLmGtMCMHe7A7aWSuQ_CJbeX_jL'
  );

  let currentUser = null;
  let selectedFile = null;

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + type;
    setTimeout(() => t.className = 'toast', 3000);
  }

  function calculerStatut(dateExp) {
    if (!dateExp) return 'valide';
    const diff = (new Date(dateExp) - new Date()) / (1000 * 60 * 60 * 24);
    if (diff < 0) return 'expire';
    if (diff < 90) return 'bientot';
    return 'valide';
  }

  function labelStatut(s) {
    if (s === 'expire') return '✕ Expirée';
    if (s === 'bientot') return '⚠ Bientôt';
    return '✓ Valide';
  }

  function handleFile(input) {
    const file = input.files[0];
    if (!file) return;
    selectedFile = file;
    document.getElementById('uploadZone').style.display = 'none';
    const preview = document.getElementById('filePreview');
    preview.classList.add('visible');
    document.getElementById('previewName').textContent = file.name;
    document.getElementById('previewSize').textContent = (file.size / 1024 / 1024).toFixed(1) + ' MB';
    document.getElementById('previewIcon').textContent = file.type.startsWith('image/') ? '🖼' : '📋';
  }

  function removeFile() {
    selectedFile = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('uploadZone').style.display = 'block';
    document.getElementById('filePreview').classList.remove('visible');
  }

  async function init() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) { window.location.href = 'zconnexion.html'; return; }
    currentUser = session.user;
    chargerCertifications();
  }

  async function ajouterCertification() {
    const nom = document.getElementById('nom').value.trim();
    const statut = document.getElementById('statut').value;
    const date_emission = document.getElementById('date_emission').value || null;
    const date_expiration = document.getElementById('date_expiration').value || null;

    if (!nom) { showToast('⚠ Veuillez entrer un nom de certification.', 'error'); return; }

    const btn = document.getElementById('btnAjouter');
    btn.disabled = true; btn.textContent = '⏳ Enregistrement...';

    let fichier_url = null;
    let fichier_nom = null;

    // Upload du fichier si présent
    if (selectedFile) {
      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      progressBar.classList.add('visible');

      // Animation de progression
      let progress = 0;
      const interval = setInterval(() => {
        progress = Math.min(progress + 10, 90);
        progressFill.style.width = progress + '%';
      }, 100);

      const ext = selectedFile.name.split('.').pop();
      const fileName = `${currentUser.id}/${Date.now()}.${ext}`;

      const { data: uploadData, error: uploadError } = await db.storage
        .from('certifications')
        .upload(fileName, selectedFile, { cacheControl: '3600', upsert: false });

      clearInterval(interval);
      progressFill.style.width = '100%';

      if (uploadError) {
        showToast('❌ Erreur upload : ' + uploadError.message, 'error');
        btn.disabled = false; btn.textContent = '✓ Ajouter la certification';
        progressBar.classList.remove('visible');
        return;
      }

      // Obtenir l'URL publique
      const { data: urlData } = db.storage.from('certifications').getPublicUrl(fileName);
      fichier_url = urlData.publicUrl;
      fichier_nom = selectedFile.name;

      setTimeout(() => progressBar.classList.remove('visible'), 500);
    }

    // Sauvegarder dans la base de données
    const { error } = await db.from('certifications').insert([{
      nom, statut, date_emission, date_expiration,
      fichier_url, fichier_nom,
      plongeur_id: currentUser.id
    }]);

    if (error) {
      showToast('❌ Erreur : ' + error.message, 'error');
    } else {
      showToast('✓ Certification ajoutée' + (fichier_url ? ' avec document !' : ' !'), 'success');
      document.getElementById('nom').value = '';
      document.getElementById('date_emission').value = '';
      document.getElementById('date_expiration').value = '';
      removeFile();
      chargerCertifications();
    }

    btn.disabled = false; btn.textContent = '✓ Ajouter la certification';
  }

  async function chargerCertifications() {
    const { data } = await db.from('certifications').select('*')
      .eq('plongeur_id', currentUser.id)
      .order('date_expiration', { ascending: true });

    const container = document.getElementById('certList');
    const count = document.getElementById('certCount');

    if (!data || data.length === 0) {
      count.textContent = '0 certification';
      container.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Aucune certification. Ajoutez-en une ci-dessus !</div></div>';
      return;
    }

    count.textContent = data.length + ' certification' + (data.length > 1 ? 's' : '');
    const icons = { valide: '🏅', bientot: '⚠️', expire: '🚨' };

    container.innerHTML = '<div class="cert-list">' + data.map(cert => {
      const statut = cert.statut || calculerStatut(cert.date_expiration);
      const dateExp = cert.date_expiration ? new Date(cert.date_expiration).toLocaleDateString('fr-CA', { day:'numeric', month:'long', year:'numeric' }) : '—';
      const dateEm = cert.date_emission ? new Date(cert.date_emission).toLocaleDateString('fr-CA', { day:'numeric', month:'long', year:'numeric' }) : '—';
      const docBtn = cert.fichier_url
        ? `<a class="btn-view" href="${cert.fichier_url}" target="_blank">📄 Voir</a>`
        : '';
      return `
        <div class="cert-item">
          <div class="cert-icon ${statut}">${icons[statut] || '🏅'}</div>
          <div class="cert-info">
            <div class="cert-name">${cert.nom}</div>
            <div class="cert-meta">Émis le ${dateEm} · Expire le ${dateExp}${cert.fichier_nom ? ' · 📎 ' + cert.fichier_nom : ''}</div>
          </div>
          <span class="cert-badge ${statut}">${labelStatut(statut)}</span>
          <div class="cert-actions">
            ${docBtn}
            <button class="btn-delete" onclick="supprimerCertification('${cert.id}', '${cert.fichier_url || ''}')">Supprimer</button>
          </div>
        </div>`;
    }).join('') + '</div>';
  }

  async function supprimerCertification(id, fichierUrl) {
    if (!confirm('Voulez-vous vraiment supprimer cette certification ?')) return;

    // Supprimer le fichier du storage si existe
    if (fichierUrl) {
      const path = fichierUrl.split('/certifications/')[1];
      if (path) await db.storage.from('certifications').remove([path]);
    }

    const { error } = await db.from('certifications').delete().eq('id', id);
    if (error) { showToast('❌ Erreur lors de la suppression.', 'error'); return; }
    showToast('✓ Certification supprimée.', 'success');
    chargerCertifications();
  }

  async function deconnexion() {
    await db.auth.signOut();
    window.location.href = 'zconnexion.html';
  }

  // Drag and drop
  const zone = document.getElementById('uploadZone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f) { document.getElementById('fileInput').files = e.dataTransfer.files; handleFile(document.getElementById('fileInput')); }
  });

  init();
</script>
</body>
</html>
