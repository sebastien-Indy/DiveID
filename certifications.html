<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiveID — Mes certifications</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --deep: #061020; --blue: #0d4f8c; --cyan: #00c4e8;
      --cyan-dim: rgba(0,196,232,0.1); --cyan-border: rgba(0,196,232,0.2);
      --white: #f0f4f8; --muted: rgba(240,244,248,0.45);
      --card-bg: rgba(13,22,40,0.75); --green: #00e8a2; --red: #e84f4f; --amber: #e8b800;
    }
    html, body { min-height: 100%; background: var(--deep); color: var(--white); font-family: 'DM Sans', sans-serif; }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 100%, rgba(13,79,140,0.4) 0%, transparent 70%); pointer-events: none; z-index: 0; }

    nav { position: relative; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 24px 48px; border-bottom: 1px solid var(--cyan-border); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--white); text-decoration: none; }
    .logo span { color: var(--cyan); }
    .btn { padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; text-decoration: none; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .btn-outline { border: 1px solid var(--cyan-border); background: transparent; color: var(--cyan); }
    .btn-outline:hover { background: var(--cyan-dim); }
    .btn-solid { border: none; background: var(--cyan); color: var(--deep); }
    .btn-solid:hover { opacity: 0.85; }

    .main { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; padding: 40px 24px 80px; }
    .page-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; margin-bottom: 4px; }
    .page-sub { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

    /* TOAST */
    .toast { position: fixed; top: 24px; right: 24px; z-index: 100; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; display: none; animation: slideIn 0.3s ease; }
    .toast.success { background: rgba(0,232,162,0.15); border: 1px solid rgba(0,232,162,0.4); color: var(--green); display: block; }
    .toast.error { background: rgba(232,79,79,0.15); border: 1px solid rgba(232,79,79,0.4); color: var(--red); display: block; }
    @keyframes slideIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }

    /* FORM CARD */
    .form-card { background: var(--card-bg); border: 1px solid var(--cyan-border); border-radius: 16px; padding: 28px; backdrop-filter: blur(12px); margin-bottom: 24px; }
    .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--cyan); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--cyan-border); }
    .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
    .field-input { background: rgba(255,255,255,0.05); border: 1px solid var(--cyan-border); border-radius: 8px; padding: 10px 14px; font-size: 14px; color: var(--white); font-family: 'DM Sans', sans-serif; outline: none; transition: border-color 0.2s; width: 100%; }
    .field-input:focus { border-color: var(--cyan); }
    .field-input::placeholder { color: var(--muted); }
    select.field-input { cursor: pointer; }
    .btn-submit { width: 100%; padding: 13px; border-radius: 10px; border: none; background: var(--cyan); color: var(--deep); font-size: 14px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: opacity 0.2s; }
    .btn-submit:hover { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

    /* LISTE */
    .list-card { background: var(--card-bg); border: 1px solid var(--cyan-border); border-radius: 16px; padding: 28px; backdrop-filter: blur(12px); }
    .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .list-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 1px; color: var(--cyan); }
    .cert-count { font-size: 13px; color: var(--muted); }

    .cert-list { display: flex; flex-direction: column; gap: 12px; }
    .cert-item { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); transition: border-color 0.2s; }
    .cert-item:hover { border-color: var(--cyan-border); }
    .cert-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .cert-icon.valide   { background: rgba(0,232,162,0.12); }
    .cert-icon.bientot  { background: rgba(232,184,0,0.12); }
    .cert-icon.expire   { background: rgba(232,79,79,0.12); }
    .cert-info { flex: 1; }
    .cert-name { font-size: 14px; font-weight: 500; margin-bottom: 3px; }
    .cert-meta { font-size: 12px; color: var(--muted); }
    .cert-badge { font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 100px; flex-shrink: 0; }
    .cert-badge.valide  { background: rgba(0,232,162,0.15); color: var(--green); border: 1px solid rgba(0,232,162,0.3); }
    .cert-badge.bientot { background: rgba(232,184,0,0.15);  color: var(--amber); border: 1px solid rgba(232,184,0,0.3); }
    .cert-badge.expire  { background: rgba(232,79,79,0.15);  color: var(--red);   border: 1px solid rgba(232,79,79,0.3); }
    .btn-delete { background: transparent; border: 1px solid rgba(232,79,79,0.3); color: var(--red); border-radius: 7px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; flex-shrink: 0; }
    .btn-delete:hover { background: rgba(232,79,79,0.1); }

    /* EMPTY STATE */
    .empty { text-align: center; padding: 40px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; }

    /* LOADING */
    .loading { text-align: center; padding: 30px; color: var(--muted); font-size: 14px; }

    @media (max-width: 600px) {
      nav { padding: 16px 20px; }
      .fields-grid { grid-template-columns: 1fr; }
      .main { padding: 20px 16px 60px; }
    }
  </style>
</head>
<body>

<div class="toast" id="toast"></div>

<nav>
  <a class="logo" href="index.html">Dive<span>ID</span></a>
  <a href="plongeur.html" class="btn btn-outline">← Mon profil</a>
</nav>

<div class="main">
  <div class="page-title">Mes certifications</div>
  <div class="page-sub">Ajoutez et gérez vos certifications de plongée commerciale.</div>

  <!-- FORMULAIRE AJOUT -->
  <div class="form-card">
    <div class="form-title">➕ Ajouter une certification</div>
    <div class="fields-grid">
      <div class="field">
        <label class="field-label">Nom de la certification *</label>
        <input class="field-input" type="text" id="nom" placeholder="ex. DCBC Classe A" />
      </div>
      <div class="field">
        <label class="field-label">Type</label>
        <select class="field-input" id="statut">
          <option value="valide">Valide</option>
          <option value="bientot">Expire bientôt</option>
          <option value="expire">Expirée</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Date d'émission</label>
        <input class="field-input" type="date" id="date_emission" />
      </div>
      <div class="field">
        <label class="field-label">Date d'expiration</label>
        <input class="field-input" type="date" id="date_expiration" />
      </div>
    </div>
    <button class="btn-submit" id="btnAjouter" onclick="ajouterCertification()">
      ✓ Ajouter la certification
    </button>
  </div>

  <!-- LISTE -->
  <div class="list-card">
    <div class="list-header">
      <div class="list-title">Mes certifications</div>
      <div class="cert-count" id="certCount">Chargement...</div>
    </div>
    <div id="certList"><div class="loading">⏳ Chargement de vos certifications...</div></div>
  </div>
</div>

<script>
  // Connexion Supabase
  const { createClient } = supabase;
  const client = createClient(
    'https://wslkcduuvcmonzftqxuy.supabase.co',
    'sb_publishable_JlTuBLmGtMCMHe7A7aWSuQ_CJbeX_jL'
  );

  // Afficher un message toast
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type;
    setTimeout(() => t.className = 'toast', 3000);
  }

  // Calculer le statut selon la date
  function calculerStatut(dateExp) {
    if (!dateExp) return 'valide';
    const exp = new Date(dateExp);
    const now = new Date();
    const diff = (exp - now) / (1000 * 60 * 60 * 24);
    if (diff < 0) return 'expire';
    if (diff < 90) return 'bientot';
    return 'valide';
  }

  // Label du statut
  function labelStatut(statut) {
    if (statut === 'expire') return '✕ Expirée';
    if (statut === 'bientot') return '⚠ Expire bientôt';
    return '✓ Valide';
  }

  // Icône selon statut
  function iconeStatut(statut) {
    if (statut === 'expire') return '🚨';
    if (statut === 'bientot') return '⚠️';
    return '🏅';
  }

  // Charger les certifications
  async function chargerCertifications() {
    const { data, error } = await client.from('certifications').select('*').order('date_expiration', { ascending: true });
    const container = document.getElementById('certList');
    const count = document.getElementById('certCount');

    if (error) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">Erreur de connexion à la base de données.</div></div>';
      return;
    }

    if (!data || data.length === 0) {
      count.textContent = '0 certification';
      container.innerHTML = '<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Aucune certification pour l\'instant. Ajoutez-en une ci-dessus !</div></div>';
      return;
    }

    count.textContent = data.length + ' certification' + (data.length > 1 ? 's' : '');
    container.innerHTML = '<div class="cert-list">' + data.map(cert => {
      const statut = cert.statut || calculerStatut(cert.date_expiration);
      const dateExp = cert.date_expiration ? new Date(cert.date_expiration).toLocaleDateString('fr-CA', {day:'numeric', month:'long', year:'numeric'}) : '—';
      const dateEm = cert.date_emission ? new Date(cert.date_emission).toLocaleDateString('fr-CA', {day:'numeric', month:'long', year:'numeric'}) : '—';
      return `
        <div class="cert-item" id="cert-${cert.id}">
          <div class="cert-icon ${statut}">${iconeStatut(statut)}</div>
          <div class="cert-info">
            <div class="cert-name">${cert.nom}</div>
            <div class="cert-meta">Émis le ${dateEm} · Expire le ${dateExp}</div>
          </div>
          <span class="cert-badge ${statut}">${labelStatut(statut)}</span>
          <button class="btn-delete" onclick="supprimerCertification('${cert.id}')">Supprimer</button>
        </div>
      `;
    }).join('') + '</div>';
  }

  // Ajouter une certification
  async function ajouterCertification() {
    const nom = document.getElementById('nom').value.trim();
    const statut = document.getElementById('statut').value;
    const date_emission = document.getElementById('date_emission').value || null;
    const date_expiration = document.getElementById('date_expiration').value || null;

    if (!nom) { showToast('⚠ Veuillez entrer un nom de certification.', 'error'); return; }

    const btn = document.getElementById('btnAjouter');
    btn.disabled = true;
    btn.textContent = 'Enregistrement...';

    const { error } = await client.from('certifications').insert([{ nom, statut, date_emission, date_expiration }]);

    if (error) {
      showToast('❌ Erreur : ' + error.message, 'error');
    } else {
      showToast('✓ Certification ajoutée avec succès !', 'success');
      document.getElementById('nom').value = '';
      document.getElementById('date_emission').value = '';
      document.getElementById('date_expiration').value = '';
      chargerCertifications();
    }

    btn.disabled = false;
    btn.textContent = '✓ Ajouter la certification';
  }

  // Supprimer une certification
  async function supprimerCertification(id) {
    if (!confirm('Voulez-vous vraiment supprimer cette certification ?')) return;
    const { error } = await client.from('certifications').delete().eq('id', id);
    if (error) {
      showToast('❌ Erreur lors de la suppression.', 'error');
    } else {
      showToast('✓ Certification supprimée.', 'success');
      chargerCertifications();
    }
  }

  // Charger au démarrage
  chargerCertifications();
</script>

</body>
</html>
